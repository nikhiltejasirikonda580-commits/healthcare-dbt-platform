name: Deploy dbt Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbt
          POSTGRES_PASSWORD: dbt
          POSTGRES_DB: healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dbt -d healthcare"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DBT_PROFILES_DIR: ../.github/dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-postgres psycopg2-binary

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create schemas
        run: |
          psql -h localhost -U dbt -d healthcare -c "create schema if not exists raw;"
          psql -h localhost -U dbt -d healthcare -c "create schema if not exists snapshots;"
        env:
          PGPASSWORD: dbt

      - name: Load sample source data
        run: |
          python .github/scripts/load_ci_data.py

      - name: dbt deps
        working-directory: dbt_build
        run: dbt deps

      - name: dbt build
        working-directory: dbt_build
        run: dbt build

      - name: dbt snapshot
        working-directory: dbt_build
        run: dbt snapshot

      - name: dbt docs generate
        working-directory: dbt_build
        run: dbt docs generate

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp dbt_build/target/index.html _site/
          cp dbt_build/target/manifest.json _site/
          cp dbt_build/target/catalog.json _site/
          if [ -f dbt_build/target/graph.gpickle ]; then cp dbt_build/target/graph.gpickle _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4